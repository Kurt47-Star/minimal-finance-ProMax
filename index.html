<!DOCTYPE html>
<html lang="th" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Minimal Finance Pro - New Transaction</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Poppins', 'Prompt', 'sans-serif'] },
          colors: {
            brand: { 500: '#f9744b', 600: '#e2643c' },
            income: { 500: '#2a9d8f' },
            saving: { 500: '#457b9d' },
            card: { light: '#ffffff', dark: '#1e293b' },
            bg: { light: '#f8fafc', dark: '#0f172a' }
          }
        }
      }
    }
  </script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    /* ลบลูกศรขึ้นลงในช่อง input number */
    input[type="number"]::-webkit-inner-spin-button, 
    input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  </style>
</head>
<body class="bg-bg-light dark:bg-bg-dark text-slate-800 dark:text-slate-100 antialiased pb-20 md:pb-0 transition-colors duration-300">

  <!-- 💻 Sidebar (ซ่อนในมือถือ) -->
  <aside class="hidden md:flex flex-col w-64 h-screen fixed top-0 left-0 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 z-50">
    <div class="p-6">
      <h1 class="text-2xl font-bold text-brand-500 tracking-wide">MF Pro<span class="text-brand-500 text-3xl">.</span></h1>
    </div>
    <nav class="flex-1 px-4 space-y-2">
      <a href="#" class="flex items-center gap-3 px-4 py-3 text-slate-500 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl font-medium transition-all">
        <span class="text-xl">📊</span> Dashboard
      </a>
      <a href="#" class="flex items-center gap-3 px-4 py-3 bg-brand-500/10 text-brand-500 dark:bg-brand-500/20 dark:text-brand-500 rounded-xl font-medium transition-all">
        <span class="text-xl">✨</span> Transactions
      </a>
      <a href="#" class="flex items-center gap-3 px-4 py-3 text-slate-500 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl font-medium transition-all">
        <span class="text-xl">🎯</span> Goals
      </a>
    </nav>
  </aside>

  <!-- 📱 Bottom Navigation (สำหรับมือถือ) -->
  <nav class="md:hidden fixed bottom-0 left-0 w-full h-16 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-t border-slate-200 dark:border-slate-800 z-50 flex justify-around items-center px-2 pb-safe">
    <a href="#" class="flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-brand-500 transition-colors">
      <span class="text-xl mb-1">📊</span>
    </a>
    <a href="#" class="flex flex-col items-center justify-center w-full h-full text-brand-500 transition-colors">
      <span class="text-xl mb-1">✨</span>
    </a>
    <div class="relative w-full flex justify-center -top-4">
      <button class="w-12 h-12 rounded-full bg-brand-500 text-white flex items-center justify-center text-2xl shadow-lg shadow-brand-500/40 active:scale-95 transition-transform">
        +
      </button>
    </div>
    <a href="#" class="flex flex-col items-center justify-center w-full h-full text-slate-400 transition-colors">
      <span class="text-xl mb-1">🎯</span>
    </a>
    <a href="#" class="flex flex-col items-center justify-center w-full h-full text-slate-400 transition-colors">
      <span class="text-xl mb-1">⚙️</span>
    </a>
  </nav>

  <!-- พื้นที่แสดงผลหลัก (Main Content) -->
  <main class="md:ml-64 p-4 md:p-8 max-w-2xl mx-auto">
    
    <header class="flex justify-between items-center mb-6 pt-2">
      <h2 class="text-xl md:text-2xl font-bold text-slate-800 dark:text-white">New Transaction</h2>
      <button class="text-slate-400 hover:text-slate-600 dark:hover:text-white transition-colors">✕ Cancel</button>
    </header>

    <!-- Form Container -->
    <section class="bg-white dark:bg-card-dark p-5 md:p-8 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-sm">
      
      <!-- 1. Transaction Type Toggle -->
      <div class="flex overflow-x-auto gap-2 pb-2 mb-6 no-scrollbar" id="type-selector">
        <button class="type-btn active px-5 py-2.5 rounded-full text-sm font-medium bg-brand-500 text-white transition-all whitespace-nowrap shadow-md shadow-brand-500/30" data-type="expense">💸 รายจ่าย</button>
        <button class="type-btn px-5 py-2.5 rounded-full text-sm font-medium bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 hover:bg-slate-200 transition-all whitespace-nowrap" data-type="income">📥 รายรับ</button>
        <button class="type-btn px-5 py-2.5 rounded-full text-sm font-medium bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 hover:bg-slate-200 transition-all whitespace-nowrap" data-type="transfer">🔄 โอนย้าย</button>
        <button class="type-btn px-5 py-2.5 rounded-full text-sm font-medium bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 hover:bg-slate-200 transition-all whitespace-nowrap" data-type="saving">🐷 เงินออม</button>
      </div>

      <!-- 2. Amount Input (ยอดเงิน) -->
      <div class="mb-8 text-center">
        <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2 block">จำนวนเงิน (THB)</label>
        <div class="flex justify-center items-end gap-1">
          <span class="text-3xl text-slate-400 dark:text-slate-500 font-bold mb-1">฿</span>
          <input type="number" placeholder="0.00" class="w-full max-w-[250px] text-5xl md:text-6xl font-bold bg-transparent text-center text-slate-800 dark:text-white outline-none placeholder-slate-300 dark:placeholder-slate-700 transition-colors" id="amount-input">
        </div>
        <div class="h-0.5 w-32 bg-slate-200 dark:bg-slate-700 mx-auto mt-2 rounded-full transition-colors" id="amount-line"></div>
      </div>

      <!-- 3. Date & Time Selection -->
      <div class="grid grid-cols-2 gap-4 mb-6">
        <div>
          <label class="text-xs font-semibold text-slate-400 uppercase mb-2 block">วันที่</label>
          <div class="flex gap-2">
            <button class="flex-1 py-3 rounded-xl bg-brand-500/10 text-brand-500 border border-brand-500/20 text-sm font-medium transition-colors" id="date-today">วันนี้</button>
            <button class="flex-1 py-3 rounded-xl bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 text-slate-500 text-sm font-medium transition-colors">เมื่อวาน</button>
          </div>
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-400 uppercase mb-2 block">เวลา</label>
          <input type="time" value="14:30" class="w-full py-3 px-4 rounded-xl bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-white text-sm font-medium outline-none focus:border-brand-500">
        </div>
      </div>

      <!-- 4. Categories & Wallet -->
      <div class="space-y-4 mb-8">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="text-xs font-semibold text-slate-400 uppercase mb-2 block">กระเป๋าเงิน (Wallet)</label>
            <select class="w-full py-3 px-4 rounded-xl bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-white text-sm outline-none focus:border-brand-500 appearance-none">
              <option>🏦 กรุงไทย</option>
              <option>📱 TrueMoney</option>
              <option>🌸 ออมสิน</option>
            </select>
          </div>
          <div>
            <label class="text-xs font-semibold text-slate-400 uppercase mb-2 block">หมวดหมู่ (Category)</label>
            <select class="w-full py-3 px-4 rounded-xl bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-white text-sm outline-none focus:border-brand-500 appearance-none">
              <option>อาหาร/เครื่องดื่ม</option>
              <option>เดินทาง</option>
              <option>ของใช้ส่วนตัว</option>
            </select>
          </div>
        </div>

        <div>
          <label class="text-xs font-semibold text-slate-400 uppercase mb-2 block">รายละเอียด (Note)</label>
          <input type="text" placeholder="ซื้อที่ไหน ทำอะไร..." class="w-full py-3 px-4 rounded-xl bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-white text-sm outline-none focus:border-brand-500">
        </div>
      </div>

      <!-- 5. Save Button -->
      <button class="w-full py-4 rounded-2xl bg-brand-500 hover:bg-brand-600 text-white font-semibold text-lg shadow-xl shadow-brand-500/20 active:scale-[0.98] transition-all" id="save-btn">
        บันทึกรายการ
      </button>

    </section>
  </main>

  <script>
    // สคริปต์ทำ Dynamic Color เปลี่ยนสีแอปตามประเภทรายรับ/รายจ่าย
    const typeBtns = document.querySelectorAll('.type-btn');
    const saveBtn = document.getElementById('save-btn');
    const amountLine = document.getElementById('amount-line');
    const dateToday = document.getElementById('date-today');

    const colors = {
      expense: { bg: 'bg-brand-500', shadow: 'shadow-brand-500/30', border: 'border-brand-500/20', text: 'text-brand-500', lightBg: 'bg-brand-500/10' },
      income: { bg: 'bg-income-500', shadow: 'shadow-income-500/30', border: 'border-income-500/20', text: 'text-income-500', lightBg: 'bg-income-500/10' },
      saving: { bg: 'bg-saving-500', shadow: 'shadow-saving-500/30', border: 'border-saving-500/20', text: 'text-saving-500', lightBg: 'bg-saving-500/10' },
      transfer: { bg: 'bg-slate-700', shadow: 'shadow-slate-700/30', border: 'border-slate-700/20', text: 'text-slate-700', lightBg: 'bg-slate-700/10' }
    };

    function resetBtnStyles(btn) {
      btn.className = "type-btn px-5 py-2.5 rounded-full text-sm font-medium bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 hover:bg-slate-200 transition-all whitespace-nowrap";
    }

    typeBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        typeBtns.forEach(resetBtnStyles);
        
        const type = btn.getAttribute('data-type');
        const c = colors[type] || colors.expense;

        // เปลี่ยนสีปุ่มที่ถูกกด
        btn.className = `type-btn active px-5 py-2.5 rounded-full text-sm font-medium text-white transition-all whitespace-nowrap shadow-md ${c.bg} ${c.shadow}`;

        // เปลี่ยนสีปุ่ม Save
        saveBtn.className = `w-full py-4 rounded-2xl text-white font-semibold text-lg shadow-xl active:scale-[0.98] transition-all ${c.bg} ${c.shadow}`;

        // เปลี่ยนสีเส้นใต้จำนวนเงินและปุ่มวันที่
        amountLine.className = `h-0.5 w-32 mx-auto mt-2 rounded-full transition-colors ${c.bg}`;
        dateToday.className = `flex-1 py-3 rounded-xl text-sm font-medium transition-colors ${c.lightBg} ${c.text} border ${c.border}`;
      });
    });
  </script>
</body>
</html>
